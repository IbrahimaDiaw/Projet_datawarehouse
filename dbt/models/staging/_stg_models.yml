version: 2

models:

  - name: stg_orders
    description: "Commandes typees. Grain : 1 ligne = 1 commande."
    columns:
      - name: order_id
        description: "Identifiant de la commande."
        tests: [unique, not_null]
      - name: customer_id
        description: "Cle vers stg_customers (attention : cle par commande)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_ts
        tests: [not_null]

  - name: stg_order_items
    description: "Articles commandes. Grain : 1 ligne = 1 article une commande."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        description: "Prix de l article hors frais de port."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: freight_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_customers
    description: "Clients. ATTENTION : le grain est la commande, pas le client."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        description: "Veritable identifiant client, base de dim_customer."
        tests: [not_null]
      - name: customer_state
        tests: [not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_category_name
        description: "Categorie, jamais NULL ('inconnu' en substitution)."
        tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: seller_state
        tests: [not_null]

  - name: stg_order_payments
    description: "Paiements. Grain : (order_id, payment_sequential)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests: [not_null]

  - name: stg_order_reviews
    description: "Avis dedupliques. Grain : 1 ligne = 1 commande notee."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_geolocation
    description: "Points GPS bruts, non dedupliques (voir int_geolocation_dedup)."
    columns:
      - name: zip_code_prefix
        tests: [not_null]

  - name: stg_product_category
    columns:
      - name: product_category_name
        tests: [unique, not_null]
      - name: product_category_name_en
        tests: [not_null]
